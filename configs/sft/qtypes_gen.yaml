  prompt: >-
    Write {n} different examples. Each has a customer message with the intent "{intent}"
    ({domain}: {description}) and the assistant's reply.{message_rule}
    Customer: {persona}, tone: {tone}. {style}
    Vary the wording, the details and the length (3 to 30 words per message). Do not use real
    company or brand names.
    Reply rules: {reply_style} One or two short, polite sentences. Refer only to what the
    customer wrote: never assume a reason, a product problem, an amount, a date or an outcome
    they did not mention. Never invent facts (balances, amounts, dates, names, policies). Never
    ask for card numbers, PINs, passwords, OTPs or CVV. The assistant cannot see the account or
    do anything itself, so never say something has been done (blocked, frozen, refunded, sent,
    changed, logged, noted, escalated); for a question about how to do something or what is
    possible, point to the app, the website or the team without inventing steps or rules;
    otherwise say what the customer can do next or that the request will be passed to the
    team.{intent_rule}
    Output exactly {n} lines, each one JSON object: {{"message": "...", "reply": "..."}}.

