# Phase 2c: English test-set candidates from the TEST splits of Banking77 (CC-BY-4.0, original
# PolyAI repository) and CLINC150 (CC-BY-3.0). Labels map to our intents only where the match is
# clear (everything else is skipped). A person checks every candidate before it enters
# data/test/test_set.jsonl (docs/TEST_SET.md); candidates are never used for training.
#   uv run python scripts/fetch_labelled.py --config configs/data/test_candidates_en.yaml
#   uv run python scripts/check_overlap.py  --config configs/data/overlap.yaml "overlap.test_files=[\"data/test/candidates-en/messages.jsonl\"]" overlap.test_field=message
#   uv run python scripts/make_review_sheet.py --config configs/data/test_candidates_en.yaml
#   (a person fills keep / correct_intent in the sheet)
#   uv run python scripts/import_review.py  --config configs/data/test_candidates_en.yaml review.verified_by=<initials>
base: ../sft/generate.yaml
run_name: test-candidates-en

fetch:
  out_dir: ${paths.data_dir}/test/candidates-en
  used_for: human test set (Phase 2c) candidates, checked by a person; never training
  sources:
    - name: banking77-test
      url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/{revision}/banking_data/test.csv
      revision: 57ec275d8078af65b7731c2a98be812d844a6d6b
      text_column: text
      label_column: category
      label_map:
        card_not_working: card_not_working
        declined_card_payment: card_not_working
        contactless_not_working: card_not_working
        declined_cash_withdrawal: card_not_working
        virtual_card_not_working: card_not_working
        card_arrival: card_not_working
        pin_blocked: card_not_working
        card_swallowed: card_not_working
        lost_or_stolen_card: lost_or_stolen_card
        failed_transfer: transfer_issue
        declined_transfer: transfer_issue
        pending_transfer: transfer_issue
        transfer_not_received_by_recipient: transfer_issue
        balance_not_updated_after_bank_transfer: transfer_issue
        card_payment_not_recognised: unrecognized_transaction
        cash_withdrawal_not_recognised: unrecognized_transaction
        direct_debit_payment_not_recognised: unrecognized_transaction
        transaction_charged_twice: unrecognized_transaction
        card_payment_fee_charged: fees_and_charges
        transfer_fee_charged: fees_and_charges
        cash_withdrawal_charge: fees_and_charges
        exchange_charge: fees_and_charges
        passcode_forgotten: account_access
        exchange_rate: other
      exclude_label_prefixes: []
      variety: english
      max_per_intent: 10
      max_per_label: null
      max_rows: null
      licence: CC-BY-4.0
      kind: real (online banking queries; origin not documented)
      description: Banking77 test split from the original PolyAI repository, labels mapped where clear
    - name: clinc150-test
      repo_id: clinc/clinc_oos
      revision: 155b9c710419136e17307b80d0a13e68cd46b4ec
      files: plus/test-*.parquet
      text_column: text
      label_column: intent
      label_map:
        balance: balance_or_statement
        transactions: balance_or_statement
        spending_history: balance_or_statement
        card_declined: card_not_working
        damaged_card: card_not_working
        report_lost_card: lost_or_stolen_card
        report_fraud: unrecognized_transaction
        interest_rate: fees_and_charges
        international_fees: fees_and_charges
        credit_limit: loans_and_credit
        credit_limit_change: loans_and_credit
        min_payment: loans_and_credit
        application_status: loans_and_credit
        account_blocked: account_access
        order_status: order_status
        greeting: other
        thank_you: other
        goodbye: other
        exchange_rate: other
        oos: other
      exclude_label_prefixes: []
      variety: english
      max_per_intent: 10
      max_per_label: null
      max_rows: null
      licence: CC-BY-3.0
      kind: real (crowdsourced)
      description: CLINC150 test split, labels mapped where clear

review:  # scripts/make_review_sheet.py, then a person fills the sheet, then scripts/import_review.py
  per_intent: 7                # candidates per intent in the sheet (the test set needs 5)
  sheet: ${fetch.out_dir}/review.csv
  test_set: ${paths.data_dir}/test/test_set.jsonl
  verified_by: null            # the reviewer's initials, given on the command line
