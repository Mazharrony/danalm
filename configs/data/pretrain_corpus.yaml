# Phase 2a pretraining corpus: ~1.5B danalm-v1 tokens from the licence-checked sources in
# docs/DATA_LEDGER.md. Character targets = token targets / tokens-per-character measured on
# the Phase 1 sample (danalm-v1): arb 0.277, ars 0.312, wikipedia-ar 0.286, fineweb-edu 0.260,
# wikipedia-en 0.292. Mix and reasons: docs/DECISIONS.md D-019.
#   1. uv run python scripts/sample_corpus.py   --config configs/data/pretrain_corpus.yaml
#   2. uv run python scripts/prepare_data.py    --config configs/data/pretrain_corpus.yaml
#   3. uv run python scripts/tokenize_corpus.py --config configs/data/pretrain_corpus.yaml
base: ../base.yaml
run_name: pretrain-corpus

sample:
  out_dir: ${paths.data_dir}/raw/pretrain_corpus
  used_for: pretraining (Phase 4)
  sources:
    - name: fineweb2-arb            # ~550M tokens
      repo_id: HuggingFaceFW/fineweb-2
      revision: af9c13333eb981300149d5ca60a8e9d659b276b9
      files: data/arb_Arab/train/*.parquet
      text_columns: [text]
      target_chars: 1985000000
      licence: ODC-By-1.0 (+ Common Crawl ToU)
      kind: real
      description: Standard Arabic web text
    - name: fineweb2-ars            # ~300M tokens, about 70% of the whole Najdi subset
      repo_id: HuggingFaceFW/fineweb-2
      revision: af9c13333eb981300149d5ca60a8e9d659b276b9
      files: data/ars_Arab/train/*.parquet
      text_columns: [text]
      target_chars: 962000000
      licence: ODC-By-1.0 (+ Common Crawl ToU)
      kind: real
      description: Najdi (Saudi) dialect web text, the closest open Gulf-like dialect
    - name: wikipedia-ar            # ~100M tokens
      repo_id: wikimedia/wikipedia
      revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
      files: 20231101.ar/*.parquet
      text_columns: [text]
      target_chars: 350000000
      licence: CC-BY-SA-3.0 + GFDL
      kind: real
      description: Arabic Wikipedia
    - name: fineweb-edu             # ~480M tokens
      repo_id: HuggingFaceFW/fineweb-edu
      revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
      files: sample/10BT/*.parquet
      text_columns: [text]
      target_chars: 1848000000
      licence: ODC-By-1.0 (+ Common Crawl ToU)
      kind: real
      description: Educational English web text
    - name: wikipedia-en            # ~50M tokens
      repo_id: wikimedia/wikipedia
      revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
      files: 20231101.en/*.parquet
      text_columns: [text]
      target_chars: 171000000
      licence: CC-BY-SA-3.0 + GFDL
      kind: real
      description: English Wikipedia
    - name: bitext-support          # the domain sets are small: take all of them (~13M tokens)
      repo_id: bitext/Bitext-customer-support-llm-chatbot-training-dataset
      revision: f93dfd8473c480417bd50123f605f11d638f014c  # refs/convert/parquet
      files: default/train/*.parquet
      text_columns: [instruction, response]
      target_chars: 0
      licence: CDLA-Sharing-1.0
      kind: synthetic (by Bitext)
      description: English customer-support requests and answers
    - name: bitext-banking
      repo_id: bitext/Bitext-retail-banking-llm-chatbot-training-dataset
      revision: 3e3621092fc6baaf7f53ceb6f091c60ae99acb67
      files: "*.parquet"
      text_columns: [instruction, response]
      target_chars: 0
      licence: CDLA-Sharing-1.0
      kind: synthetic (by Bitext)
      description: English retail-banking requests and answers
    - name: bitext-telco
      repo_id: bitext/Bitext-telco-llm-chatbot-training-dataset
      revision: 4558834597845ec6368f563d1c8f957ba725183f  # refs/convert/parquet
      files: default/train/*.parquet
      text_columns: [instruction, response]
      target_chars: 0
      licence: CDLA-Sharing-1.0
      kind: synthetic (by Bitext)
      description: English telecom requests and answers
    - name: clinc-train
      repo_id: clinc/clinc_oos
      revision: 155b9c710419136e17307b80d0a13e68cd46b4ec
      files: plus/train-*.parquet
      text_columns: [text]
      target_chars: 0
      licence: CC-BY-3.0
      kind: real (crowdsourced)
      description: English assistant queries incl. out-of-scope (train split only)
    - name: massive-ar-train
      repo_id: AmazonScience/massive
      revision: ed58ac423a2f4121720918bf5301577edce4ffd3  # refs/convert/parquet
      files: ar-SA/train/*.parquet
      text_columns: [utt]
      target_chars: 0
      licence: CC-BY-4.0
      kind: real (localized by native speakers)
      description: Arabic (ar-SA) assistant utterances (train split only)

data:  # streaming cleaning (scripts/prepare_data.py); val = held-out loss during pretraining
  inputs: ["${sample.out_dir}/*.jsonl"]
  out_dir: ${paths.data_dir}/pretrain_corpus
  text_field: text
  strip_diacritics: true
  unify_alef: false            # D-014
  min_chars: 10
  max_chars: 1000000
  min_letter_ratio: 0.5
  repetitive_min_words: 6
  min_unique_word_ratio: 0.1
  near_dup_threshold: 0        # sources are deduplicated upstream; exact dedup still runs
  minhash_num_perm: 64
  shingle_words: 3
  val_frac: 0.005              # ~7M tokens of held-out text, plenty for a stable val loss

tokenize:  # scripts/tokenize_corpus.py
  tokenizer_file: ${paths.artifacts_dir}/tokenizers/danalm-v1/tokenizer.json
  tokenizer_name: danalm-v1
  eos_token: "<|endoftext|>"
  shard_tokens: 100000000      # 100M tokens = 200 MB per uint16 shard
  batch_docs: 1000
  out_dir: ${paths.data_dir}/pretrain_tokens
  verify_docs: 400             # scripts/verify_shards.py: random docs per split decoded and compared
