[project]
name = "danalm"
version = "0.1.0"
description = "DanaLM: a small decoder-only language model for UAE customer service (Gulf Arabic, English, Arabizi), trained from scratch."
readme = "README.md"
license = "Apache-2.0"  # the code; data sources keep their own licences (docs/DATA_LEDGER.md)
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# Exact versions live in uv.lock; bounds here only say what the code is written against.
dependencies = [
    "datasketch>=2.0",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5",
    "onnx>=1.23",
    "onnxruntime>=1.30",
    "onnxscript>=0.7",
    "psutil>=7.2.2",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
    "tokenizers>=0.23",
    "torch>=2.14,<2.15",
    "transformers>=5.17",
    "triton-windows>=3.8,<3.9 ; sys_platform == 'win32'",
    "wandb>=0.30",
]

[dependency-groups]
dev = [
    "black>=26.5",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/danalm"]

# ---------------------------------------------------------------- uv
[tool.uv]
# Only resolve for the platforms we use: Windows (training) and Linux (CI / Docker).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
# PyPI's Windows torch wheel is CPU-only, so Windows pulls the CUDA 13.0 build.
# Linux (CI, Docker, inference) pulls the much smaller CPU build.
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------- code quality
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.isort]
known-first-party = ["danalm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: needs a CUDA GPU (skipped when none is available)"]
